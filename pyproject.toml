[project]
name = "bobby"
version = "0.1.0"
description = "Personal AI assistant — voice control, memory, phone bridge"
requires-python = ">=3.11"

dependencies = [
    # LLM
    "anthropic>=0.40.0",

    # Wake word (0.6.0+ requires tflite-runtime which doesn't support Python 3.13)
    "openwakeword>=0.4.0",

    # Speech-to-text
    "openai-whisper>=20240930",
    "numpy>=1.26.0",
    # Audio capture/playback via parecord+ffplay (PulseAudio) — no PortAudio needed on WSL2
    # sounddevice removed: conda's libportaudio is ALSA-only, has no devices in WSL2

    # Text-to-speech (ElevenLabs via REST — no SDK needed)
    "httpx>=0.27.0",          # REST calls to ElevenLabs API
    "pyttsx3>=2.90",          # fallback TTS
    # miniaudio removed: ElevenLabs MP3 now piped directly to ffplay

    # OS control (Windows-specific packages excluded on Linux/macOS)
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "pycaw>=0.6.1; sys_platform == 'win32'",     # Windows audio endpoint volume control
    "comtypes>=1.4.0; sys_platform == 'win32'",  # COM interop required by pycaw
    "keyboard>=0.13.5",
    "psutil>=5.9.0",

    # Memory (Phase 3 — chromadb + sentence-transformers deferred; adds ~1GB PyTorch)

    # Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-multipart>=0.0.9",

    # Browser automation (Phase 6 — not yet implemented)
    # "playwright>=1.48.0",

    # Spotify Web API
    "spotipy>=2.24.0",

    # Screen capture
    "mss>=9.0.1",             # fast cross-platform screenshots (MJPEG stream)
    "Pillow>=10.0.0",

    # Utilities
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",           # pretty console output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "memory*", "server*"]

[project.scripts]
bobby = "core.pipeline:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
