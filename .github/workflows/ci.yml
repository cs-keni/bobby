name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast checks on ubuntu — no Windows deps needed
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Check formatting
        run: ruff format --check .
      - name: Check style
        run: ruff check .

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # -ll = medium+ severity only, -q = quiet (no noise on passing files)
      - name: Scan for vulnerabilities
        run: bandit -r core/ tools/ -ll -q

  # Windows runner — needed for pywin32/pywinauto/keyboard installs
  type-check:
    name: Type check (mypy)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: mypy core/ tools/

  test:
    name: Tests (pytest)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov
      - name: Run pytest with coverage
        run: pytest tests/ -v --tb=short --cov=core --cov=tools --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
